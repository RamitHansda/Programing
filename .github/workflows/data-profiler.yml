name: data-profiler

on:
  push:
    paths:
      - "data_profiler/**"
      - ".github/workflows/data-profiler.yml"
  pull_request:
    paths:
      - "data_profiler/**"
      - ".github/workflows/data-profiler.yml"

defaults:
  run:
    working-directory: data_profiler

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev,parquet]"
      - name: Lint
        run: ruff check src tests demos
      - name: Test
        run: pytest -q
      - name: Demo (end-to-end smoke test)
        run: python demos/run_demo.py
