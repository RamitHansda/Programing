version: "3.9"

# ---------------------------------------------------------------------------
# Infrastructure for local development and CI.
# For production, replace with managed services:
#   Kafka  → Confluent Cloud / Amazon MSK
#   Redis  → ElastiCache / Redis Cloud
#   Postgres → Amazon RDS / Cloud SQL
# ---------------------------------------------------------------------------

services:

  # ---------- Kafka cluster (single-broker for local dev) ------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Pre-create topics with high partition counts for scale testing.
      KAFKA_CREATE_TOPICS: "job-candidate-matches:100:1,candidate-emails:100:1,candidate-emails-dlq:1:1"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      retries: 10

  # ---------- Redis ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ---------- PostgreSQL (candidate & job metadata) -------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ---------- Matching service (batch sweep) --------------------------------
  matching-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.run_matching", "--stub", "--dry-run"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobmatch
      FAISS_INDEX_DIR: /data/faiss
      EMBEDDING_DIM: "256"
      FAISS_NUM_SHARDS: "1000"
      MATCHING_TOP_K: "500"
      MATCHING_MIN_SCORE: "0.70"
      MATCHING_SHARD_WORKERS: "16"
      LOG_LEVEL: INFO
    volumes:
      - faiss_data:/data/faiss

  # ---------- Email worker (multiple replicas) ------------------------------
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.run_email_worker", "--stub"]
    deploy:
      replicas: 3   # scale this up to 50 in production
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      KAFKA_CONSUMER_GROUP: email-workers
      EMAIL_PROVIDER: stub
      EMAIL_WORKER_CONCURRENCY: "100"
      EMAIL_MAX_RETRIES: "3"
      REDIS_RATE_LIMIT_RPS: "5000"
      REDIS_DEDUP_TTL: "2592000"
      LOG_LEVEL: INFO

  # ---------- Index builder (one-off job) -----------------------------------
  index-builder:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -m scripts.index_builder
        --shard-start 0 --shard-end 0 --dry-run
    profiles: ["indexing"]   # only run with: docker compose --profile indexing up
    environment:
      FAISS_INDEX_DIR: /data/faiss
      EMBEDDING_DIM: "256"
    volumes:
      - faiss_data:/data/faiss

volumes:
  pgdata:
  faiss_data:
